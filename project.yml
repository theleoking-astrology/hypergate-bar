name: HypergateBar
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
packages:
  HypergateCore:
    path: Packages/HypergateCore
targets:
  HypergateBar:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: HypergateBar
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026 Hypergate AI Open Source"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hypergate.HypergateBar
    dependencies:
      - package: HypergateCore
        product: HypergateCore
      - package: HypergateCore
        product: HypergateAstronomyEngine
schemes:
  HypergateBar:
    build:
      targets:
        HypergateBar: all
    run:
      config: Debug
