name: Website validation
on:
  push:
    branches: [main]
    paths: ['website/**', 'vercel.json', 'CHANGELOG.md', 'docs/screenshots/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'vercel.json', 'CHANGELOG.md', 'docs/screenshots/**', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify static site
        run: node website/check.mjs
