name: macOS validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            xcode: '16.2'
          - runner: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: xcodebuild -version && swift --version
      - name: Source and provenance checks
        run: make check
      - name: Offline package, service, and UI tests
        run: make test
      - name: Development package
        run: make package-local
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.runner }}
          path: |
            ~/Library/Caches/HypergateBar/*/TestResults
            dist/*
          if-no-files-found: warn
